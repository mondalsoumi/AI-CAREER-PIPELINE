version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: ai-career-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    
  # Cache and Event Broker
  redis:
    image: redis:7-alpine
    container_name: ai-career-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ai-career-api-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - APPLICATION_SERVICE_URL=http://application-service:8002
      - ANALYTICS_SERVICE_URL=http://analytics-service:8003
      - AI_SERVICE_URL=http://ai-service:8004
    depends_on:
      - auth-service
      - application-service
      - analytics-service
      - ai-service
    networks:
      - app-network

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: ai-career-auth-service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=${AUTH_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
    networks:
      - app-network

  # Application Service
  application-service:
    build:
      context: ./application-service
      dockerfile: Dockerfile
    container_name: ai-career-application-service
    restart: always
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=${APPLICATION_DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - UPLOADS_DIR=${UPLOADS_DIR:-/app/uploads}
    volumes:
      - ./uploads:${UPLOADS_DIR:-/app/uploads}
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  # Analytics Service
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: ai-career-analytics-service
    restart: always
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - DATABASE_URL=${ANALYTICS_DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-career-ai-service
    restart: always
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - app-network

  # Web Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-career-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api-gateway
    networks:
      - app-network
  #minio (for storage)
  minio:
    image: minio/minio:latest
    container_name: ai-career-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
networks:
  app-network:
    driver: bridge
  